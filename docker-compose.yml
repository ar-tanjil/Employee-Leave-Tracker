
services:
  mysql:
    image: mysql:8
    container_name: employee-leave-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_leave_tracker
      MYSQL_USER: employee_user
      MYSQL_PASSWORD: employee_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      retries: 5
    networks:
      - employee-network

  backend:
    build: ./backend
    container_name: employee-leave-backend
    restart: unless-stopped
    ports:
      - "9099:8099"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_leave_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: employee_user
      SPRING_DATASOURCE_PASSWORD: employee_pass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - employee-network

  frontend:
    build: ./frontend
    container_name: employee-leave-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - employee-network

volumes:
  mysql_data:

networks:
  employee-network:
    driver: bridge