spring:
  datasource:
    url: jdbc:mysql://mysql:3306/employee_leave_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: employee_user
    password: employee_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


# Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Logging
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
