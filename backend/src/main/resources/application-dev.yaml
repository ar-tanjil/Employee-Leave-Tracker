spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_leave_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


# Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true



# Logging
logging:
  level:
    root: INFO
    org:
      hibernate:
        event:
          internal: DEBUG
        session:
          metrics: DEBUG
        SQL: DEBUG
        stat: DEBUG
      flywaydb: DEBUG
      org.springframework.boot.autoconfigure.flyway: DEBUG