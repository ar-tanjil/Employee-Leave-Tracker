<div class="mb-6 mt-3 px-4">

  <div class="flex items-center justify-between">

    <!-- Breadcrumb -->
    <nav class="text-sm text-zinc-500 flex items-center space-x-2">
    

      @for (item of breadcrumbs(); track $index) {
  <ng-container>
    
    <span
      class="hover:text-zinc-900 cursor-pointer"
      (click)="navigateTo(item.url)"
    >
      {{ item.label }}
    </span>

    @if (!$last) {
      <span class="text-zinc-300 mx-1">›</span>
    }

  </ng-container>
}

    </nav>

  </div>

  <!-- Divider -->
  <div class="mt-3 border-b border-zinc-200"></div>
</div>



<!-- Main Content -->
<div class="mb-6 mt-1 px-4">
  <!-- Router Outlet -->
  <router-outlet />
</div>
