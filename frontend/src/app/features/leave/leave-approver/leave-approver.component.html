<app-table [columns]="columnsDef" [pageData]="pageData" [loading]="loading()" (queryChange)="onQueryChange($event)">

  <ng-template appCell="startDate" let-row>
    <strong>{{ row.startDate | date}} - {{ row.endDate | date}}</strong>
  </ng-template>

  <ng-template appCell="status" let-row>
    <span class="inline-flex items-center px-3 py-1 bg-red-100 text-red-800 rounded-full text-xs font-medium">
      {{ row.status }}
    </span>
  </ng-template>

  <ng-template #actions let-row>
    <app-icon (click)="handleLeaveAction(row)" name="edit" appTooltip="Approve Leave" tooltipType="bg-indigo-600"
      class="text-indigo-600 cursor-pointer bg-indigo-300 hover:bg-indigo-200 p-1.5 rounded" />

  <!-- View Icon -->
    <app-icon (click)="openLeaveDetails(row)" name="view" appTooltip="View Leave Details" tooltipType="bg-blue-800"
      class="text-blue-800 cursor-pointer bg-blue-300 hover:bg-blue-200 p-1.5 rounded" />
    </ng-template>



</app-table>


@if (showLeaveDetail()) {
<app-leave-view [leave]="selectedLeave()!" (onCancelled)="closeLeaveDetails()" />
}
