<section class="p-2">
  <div class="mx-auto space-y-5">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Leave List</h1>
        <p class="text-sm text-zinc-500 mt-0.5">Applied Leave List</p>
      </div>
      <button (click)="openForm(null)" class="btn-primary">+ Apply Leave</button>
    </div>
  </div>

  <!-- Leave Table -->
    <app-table [columns]="columnsDef" [pageData]="pageData" [loading]="loading()" [initialPageSize]="10"
      [pageSizes]="[5, 10, 25, 50]" (queryChange)="onQueryChange($event)">
      <!--
        Action column — parent fully owns the buttons.
        `let-row` is typed as EmployeeTable.
        Buttons are conditional: Delete only for active users.
      -->
      <!-- <ng-template #actions let-row>
        <button (click)="openViewDetails(row.id)" class="viewBtn">View</button>
        <button (click)="openForm(row.id)" class="editBtn">Edit</button>
        @if(canDelete) {
        <button (click)="confirmDelete(row)"
          class=" cursor-pointer inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-red-50 text-red-600 hover:bg-red-100 transition-colors">
          Delete
        </button>
        }
      </ng-template> -->
    </app-table>
</section>



<!-- Leave Form Modal -->
@if (showForm()) {
<app-leave-form (onSaved)="onSaved()"  (onCancelled)="showForm.set(false)" />
}
