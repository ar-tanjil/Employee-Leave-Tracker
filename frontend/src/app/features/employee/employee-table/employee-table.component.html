<section class="p-2">
  <div class="mx-auto space-y-5">

    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-gray-700">Employee List</h1>
        <p class="text-sm text-zinc-500 mt-0.5">
          Manage employee information and details.
        </p>
      </div>
      <button (click)="openForm(null)" class="btn-primary">
        + Add user
      </button>
    </div>

    <!-- Employee table -->
    <app-table [columns]="columnsDef" [pageData]="pageData" [loading]="loading()" (queryChange)="onQueryChange($event)">

      <!-- Custom cell templates can be defined here -->
      <ng-template appCell="firstName" let-row>
        <strong>{{ row.firstName }} {{ row.lastName }}</strong>
      </ng-template>

      <!--
        Action column — parent fully owns the buttons.
      -->
      <ng-template #actions let-row>

        <!-- View Icon -->
        <app-icon (click)="openViewDetails(row.id)" name="view" appTooltip="View Employee Details" tooltipType="bg-blue-800"
          class="text-blue-800 cursor-pointer bg-blue-300 hover:bg-blue-200 p-1.5 rounded" />

        <!-- Edit Icon -->
        <app-icon (click)="openForm(row.id)" name="edit" appTooltip="Edit Employee" tooltipType="bg-indigo-600"
          class="text-indigo-600 cursor-pointer bg-indigo-300 hover:bg-indigo-200 p-1.5 rounded" />

          <!-- Assign Role -->
            <app-icon (click)="openAsignRole(row.id)" name="user" appTooltip="Assign Role" tooltipType="bg-zinc-600"
          class="text-zinc-100 cursor-pointer bg-zinc-600 hover:bg-zinc-400 p-1.5 rounded" />
        @if(hasDeletePermission) {

        <app-icon (click)="confirmDelete(row)"  name="delete" appTooltip="Delete Employee" tooltipType="bg-red-500"
          class="text-red-800 cursor-pointer bg-red-300  hover:bg-red-200 p-1.5 rounded" />
        }
      </ng-template>
    </app-table>
  </div>
</section>


<!-- Employee Form Modal -->
@if (showForm()) {
<app-employee-form (onSaved)="onSaved()" (onClose)="showForm.set(false)" [employeeId]="selectedEmployeeId()" />
}

<!-- Employee View Modal -->
@if (showView()) {
<app-employee-view (onClose)="showView.set(false)" [employeeId]="selectedEmployeeId()!" />
}


<!-- Employee Asign Role Modal -->
@if (showAsignRole()) {
<app-role-assign (onCompleted)="onAsigned()" [employeeId]="selectedEmployeeId()!"
  (onClose)="showAsignRole.set(false)" />
}
