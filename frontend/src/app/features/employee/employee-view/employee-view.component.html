<app-dialog title="Employee Details" (close)="onClose.emit()">
  <div class="mx-auto p-6 bg-white border border-gray-200">

    <!-- Header/Profile Section -->
    <div class="flex items-center space-x-4 mb-8 border-b pb-6">
      <div class="h-16 w-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl font-bold">
        <!-- {{ employee().firstName[0] }}{{ employee().lastName?[0] }} --> af
      </div>
      <div>
        <h2 class="text-2xl font-bold text-gray-900">{{ employee().firstName }} {{ employee().lastName }}</h2>
        <p class="text-sm text-gray-500">Emp Code: <span class="font-mono font-semibold text-gray-700">{{
            employee().employeeCode }}</span></p>
      </div>
    </div>

    <!-- Details Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">

      <!-- Email -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Email Address</label>
        <p class="text-sm text-gray-900">{{ employee().email }}</p>
      </div>

      <!-- Employment Type -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Employment Type</label>
        <span
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
          {{ employee().employmentType }}
        </span>
      </div>

      <!-- Department -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Department</label>
        <p class="text-sm text-gray-900">{{ employee().departmentName}}</p>
      </div>

      <!-- Designation -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Designation</label>
        <p class="text-sm text-gray-900">{{ employee().designationName }}</p>
      </div>

      <!-- Hire Date -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Hire Date</label>
        <p class="text-sm text-gray-900">{{ employee().hireDate | date:'longDate' }}</p>
      </div>

      <!-- Status (Added for context) -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Status</label>
        <p class="text-sm text-green-600 font-medium">Active</p>
      </div>

    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end pt-8 mt-6 border-t">
      <button type="button" (click)="onClose.emit()"
        class="bg-white py-2 cursor-pointer px-6 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
        Close
      </button>

    </div>
  </div>
</app-dialog>
