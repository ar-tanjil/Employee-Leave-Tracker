<app-dialog (close)="onClose.emit()" title="Change Password" sizeClass="max-w-md">

  <div class="mx-auto overflow-hidden border border-gray-100 px-3 py-2">


    <form [formGroup]="passwordForm" (ngSubmit)="updatePassword()" class="space-y-4">

      <!-- Old Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Current Password</label>
        <input type="password" formControlName="oldPassword"
          class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          [class.border-red-500]="passwordForm.get('oldPassword')?.touched && passwordForm.get('oldPassword')?.invalid">
      </div>

      <!-- New Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700">New Password</label>
        <input type="password" formControlName="newPassword"
          class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <p class="text-xs text-gray-500 mt-1">Minimum 5 characters.</p>
      </div>

      <!-- Confirm New Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm New Password</label>
        <input type="password" formControlName="confirmPassword"
          class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        @if (passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched) {
        <p class="text-red-500 text-xs mt-1">Passwords do not match.</p>
        }
      </div>

      <!-- Actions -->
      <div class="pt-4 flex items-center justify-end gap-3">
        <button (click)="onClose.emit()" type="button" class=" cursor-pointer text-sm font-medium text-gray-600 hover:text-gray-800">
          Cancel
        </button>
        <button type="submit" [disabled]="passwordForm.invalid"
          class="px-4 py-2 bg-indigo-600 cursor-pointer text-white text-sm font-semibold rounded-md shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
          Update Password
        </button>
      </div>
    </form>

  </div>
</app-dialog>
